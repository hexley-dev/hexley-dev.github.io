<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Guide Explorer — 10 Designs per Issue</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: #1a1a2e;
    color: #e0e0e0;
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.5rem 1rem 1.5rem;
    background: linear-gradient(135deg, #16213e 0%, #0f3460 50%, #1a1a2e 100%);
    border-bottom: 3px solid #e94560;
  }

  header h1 {
    font-family: 'Bangers', cursive;
    font-size: 2.6rem;
    color: #e94560;
    letter-spacing: 2px;
    margin-bottom: 0.4rem;
  }

  header p {
    font-size: 1rem;
    color: #a0a0c0;
    max-width: 700px;
    margin: 0 auto;
    line-height: 1.5;
  }

  /* Tab bar */
  .tab-bar {
    display: flex;
    gap: 0;
    overflow-x: auto;
    background: #0f1a30;
    border-bottom: 2px solid #2a2a4e;
    padding: 0 1rem;
    position: sticky;
    top: 0;
    z-index: 20;
    -webkit-overflow-scrolling: touch;
  }

  .tab-bar::-webkit-scrollbar { height: 4px; }
  .tab-bar::-webkit-scrollbar-thumb { background: #4a4a6e; border-radius: 2px; }

  .tab {
    flex-shrink: 0;
    padding: 0.8rem 1.2rem;
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    color: #808090;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    white-space: nowrap;
    position: relative;
  }

  .tab:hover { color: #c0c0d8; }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab .pick-dot {
    display: none;
    position: absolute;
    top: 6px;
    right: 4px;
    width: 8px;
    height: 8px;
    background: #48bb78;
    border-radius: 50%;
  }

  .tab.has-pick .pick-dot { display: block; }

  /* Issue panels */
  .issue-panel {
    display: none;
    padding: 1.5rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .issue-panel.active { display: block; }

  .issue-header {
    text-align: center;
    margin-bottom: 1.5rem;
  }

  .issue-header h2 {
    font-family: 'Bangers', cursive;
    font-size: 1.8rem;
    color: var(--accent);
    letter-spacing: 1px;
  }

  .issue-header .era {
    font-family: 'Patrick Hand', cursive;
    color: #808090;
    font-size: 1rem;
  }

  .issue-header .instruction {
    font-size: 0.9rem;
    color: #606080;
    margin-top: 0.3rem;
  }

  .design-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
  }

  .design-card {
    background: #16213e;
    border-radius: 10px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    position: relative;
  }

  .design-card:hover {
    border-color: var(--accent);
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3);
  }

  .design-card.selected {
    border-color: #48bb78;
    box-shadow: 0 0 16px rgba(72, 187, 120, 0.3);
  }

  .design-card.selected::after {
    content: '★ PICK';
    position: absolute;
    top: 8px;
    right: 8px;
    background: #48bb78;
    color: #1a1a2e;
    font-family: 'Patrick Hand', cursive;
    font-size: 0.85rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 16px;
    z-index: 2;
  }

  .design-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #0f0f1e;
  }

  .design-card .card-info {
    padding: 0.8rem;
  }

  .design-card .card-info h3 {
    font-family: 'Bangers', cursive;
    font-size: 1.15rem;
    color: var(--accent);
    letter-spacing: 0.5px;
    margin-bottom: 0.3rem;
    text-transform: capitalize;
  }

  .design-card .card-info p {
    font-size: 0.82rem;
    line-height: 1.5;
    color: #9090a8;
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    align-items: center;
    justify-content: center;
    cursor: zoom-out;
    flex-direction: column;
    gap: 1rem;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 85vw;
    max-height: 80vh;
    border-radius: 8px;
  }
  .lightbox .lb-caption {
    font-family: 'Patrick Hand', cursive;
    font-size: 1.2rem;
    color: #c0c0d8;
  }

  /* Summary bar */
  .summary {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f3460;
    border-top: 2px solid #e94560;
    padding: 0.8rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'Patrick Hand', cursive;
    font-size: 1rem;
    z-index: 10;
    transition: transform 0.3s;
    gap: 1rem;
  }
  .summary.hidden { transform: translateY(100%); }
  .summary .picks-text { color: #c0c0d8; flex: 1; }
  .summary .picks-text strong { color: #48bb78; }
  .summary button {
    background: #e94560;
    color: white;
    border: none;
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    font-family: 'Bangers', cursive;
    font-size: 1rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .summary button:hover { background: #c73e54; }

  footer {
    text-align: center;
    padding: 2rem 1rem 5rem;
    color: #505068;
    font-size: 0.8rem;
  }

  @media (max-width: 600px) {
    .design-grid { grid-template-columns: repeat(2, 1fr); gap: 0.8rem; }
    .design-card .card-info p { display: none; }
    header h1 { font-size: 2rem; }
    .tab { padding: 0.6rem 0.8rem; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Robot Guide Explorer</h1>
  <p>10 character designs per issue. Pick your favorite for each era. Click images to zoom. Click cards to select.</p>
</header>

<div class="tab-bar" id="tab-bar"></div>
<div id="panels"></div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lb-img" src="" alt="">
  <div class="lb-caption" id="lb-caption"></div>
</div>

<div class="summary hidden" id="summary">
  <div class="picks-text" id="picks-text"></div>
  <button onclick="copyPicks()">Copy Picks</button>
</div>

<footer>From Turing to Swarms — Character Design Explorer</footer>

      { id: '06_neural_display', name: 'Neural Display', desc: 'Transparent chest showing neural network nodes pulsing, lightbulb antenna.' },
      { id: '07_training_bot', name: 'Training Bot', desc: 'Sorting cat vs dog photos into bins, confused but determined, checkmark stamps.' },
      { id: '08_weight_dial', name: 'Weight Dial', desc: 'Covered in adjustment dials, tuning itself, meter gauge face showing smile.' },
      { id: '09_data_funnel', name: 'Data Funnel', desc: 'Funnel on head collecting data, messy input becomes neat output, glass body.' },

// State: one pick per issue
const picks = {};
const tabBar = document.getElementById('tab-bar');
const panels = document.getElementById('panels');
const summary = document.getElementById('summary');
const picksText = document.getElementById('picks-text');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCaption = document.getElementById('lb-caption');

// Build UI
ISSUES.forEach((issue, idx) => {
  const accent = ACCENT[issue.key];

  // Tab
  const tab = document.createElement('div');
  tab.className = `tab${idx === 0 ? ' active' : ''}`;
  tab.style.setProperty('--accent', accent);
  tab.id = `tab-${issue.key}`;
  tab.innerHTML = `#${issue.num} <span class="pick-dot"></span>`;
  tab.onclick = () => switchTab(issue.key);
  tabBar.appendChild(tab);

  // Panel
  const panel = document.createElement('div');
  panel.className = `issue-panel${idx === 0 ? ' active' : ''}`;
  panel.id = `panel-${issue.key}`;
  panel.style.setProperty('--accent', accent);
  panel.innerHTML = `
    <div class="issue-header">
      <h2>Issue ${issue.num}: ${issue.title}</h2>
      <div class="era">${issue.era}</div>
      <div class="instruction">Click to pick your favorite guide for this issue</div>
    </div>
    <div class="design-grid" id="grid-${issue.key}"></div>
  `;
  panels.appendChild(panel);

  const grid = panel.querySelector('.design-grid');
  issue.designs.forEach(d => {
    const file = `${issue.key}_${d.id}`;
    const card = document.createElement('div');
    card.className = 'design-card';
    card.id = `card-${file}`;
    card.style.setProperty('--accent', accent);
    card.innerHTML = `
      <img src="images/${file}.png" alt="${d.name}"
           loading="lazy" onclick="event.stopPropagation(); openLB('images/${file}.png', '${d.name} — Issue ${issue.num}')">
      <div class="card-info">
        <h3>${d.name}</h3>
        <p>${d.desc}</p>
      </div>
    `;
    card.addEventListener('click', () => pickDesign(issue.key, file, d.name));
    grid.appendChild(card);
  });
});

function switchTab(key) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.issue-panel').forEach(p => p.classList.remove('active'));
  document.getElementById(`tab-${key}`).classList.add('active');
  document.getElementById(`panel-${key}`).classList.add('active');
}

function pickDesign(issueKey, file, name) {
  const prev = picks[issueKey];
  if (prev) document.getElementById(`card-${prev.file}`)?.classList.remove('selected');

  if (prev && prev.file === file) {
    delete picks[issueKey];
    document.getElementById(`tab-${issueKey}`).classList.remove('has-pick');
  } else {
    picks[issueKey] = { file, name };
    document.getElementById(`card-${file}`).classList.add('selected');
    document.getElementById(`tab-${issueKey}`).classList.add('has-pick');
  }
  updateSummary();
}

function updateSummary() {
  const count = Object.keys(picks).length;
  if (count === 0) { summary.classList.add('hidden'); return; }
  summary.classList.remove('hidden');
  const lines = ISSUES
    .filter(i => picks[i.key])
    .map(i => `<strong>#${i.num}</strong> ${picks[i.key].name}`);
  picksText.innerHTML = `Picks (${count}/10): ${lines.join(' · ')}`;
}

function openLB(src, caption) {
  lbImg.src = src;
  lbCaption.textContent = caption;
  lightbox.classList.add('active');
}

function copyPicks() {
  const lines = ISSUES
    .filter(i => picks[i.key])
    .map(i => `Issue ${i.num} (${i.era}): ${picks[i.key].name} [${picks[i.key].file}]`);
  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.querySelector('.summary button');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy Picks', 1500);
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') lightbox.classList.remove('active');
  // Arrow keys for tab switching
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    const activeIdx = ISSUES.findIndex(i => document.getElementById(`panel-${i.key}`).classList.contains('active'));
    const next = e.key === 'ArrowRight'
      ? Math.min(activeIdx + 1, ISSUES.length - 1)
      : Math.max(activeIdx - 1, 0);
    switchTab(ISSUES[next].key);
  }
});
</script>
