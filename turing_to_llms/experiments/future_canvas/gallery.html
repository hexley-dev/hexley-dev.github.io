<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Canvas — Concept Art Gallery</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080c12;
  --surface: #0f1520;
  --surface-hover: #161e2e;
  --border: #1e293b;
  --text: #e2e8f0;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent: #f59e0b;
  --accent-dim: rgba(245, 158, 11, 0.15);
  --tab-active: #f59e0b;
  --tag-robots: #818cf8;
  --tag-scenes: #34d399;
  --tag-styles: #f472b6;
  --radius: 8px;
  --radius-lg: 12px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ─────────────────────────────────── */
.header {
  padding: 24px 32px 0;
  max-width: 1400px;
  margin: 0 auto;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-muted);
  text-decoration: none;
  font-size: 14px;
  font-family: var(--font-mono);
  transition: color 0.2s;
}
.back-link:hover { color: var(--accent); }

.page-title {
  font-family: var(--font-display);
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  color: var(--text);
  margin: 16px 0 4px;
  letter-spacing: -0.02em;
}

.page-subtitle {
  color: var(--text-dim);
  font-size: 16px;
  margin-bottom: 24px;
}

/* ── Tabs ───────────────────────────────────── */
.tab-bar {
  display: flex;
  gap: 4px;
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 32px;
  border-bottom: 1px solid var(--border);
}

.tab-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 20px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  position: relative;
  bottom: -1px;
}
.tab-btn:hover { color: var(--text-dim); }
.tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.tab-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 11px;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--font-mono);
}
.tab-btn.active .tab-badge { background: var(--accent-dim); color: var(--accent); }
.tab-btn:not(.active) .tab-badge { background: rgba(100,116,139,0.2); color: var(--text-muted); }

/* ── Filter bar ─────────────────────────────── */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 32px;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-dim);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--text-muted); color: var(--text); }
.filter-btn.active {
  background: var(--accent-dim);
  border-color: var(--accent);
  color: var(--accent);
}

.image-counter {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
}

/* ── Grid ───────────────────────────────────── */
.gallery-container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 32px 64px;
}

.subcategory-section { margin-bottom: 32px; }

.subcategory-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 0 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.subcategory-name {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  color: var(--text);
  text-transform: capitalize;
}

.subcategory-count {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-muted);
  background: rgba(100,116,139,0.15);
  padding: 2px 8px;
  border-radius: 10px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

@media (max-width: 1024px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) {
  .card-grid { grid-template-columns: 1fr; }
  .header, .tab-bar, .filter-bar, .gallery-container { padding-left: 16px; padding-right: 16px; }
  .tab-btn { padding: 10px 12px; font-size: 13px; }
}

/* ── Card ───────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.25s ease;
}
.card:hover {
  border-color: var(--text-muted);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}

.card-thumb {
  width: 100%;
  aspect-ratio: 1;
  background: var(--surface-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.3s ease;
}
.card:hover .card-thumb img { transform: scale(1.03); }

.card-thumb .placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 13px;
  font-family: var(--font-mono);
}
.placeholder-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: rgba(100,116,139,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
}

.card-info {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.card-name {
  font-weight: 600;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.card-tag {
  flex-shrink: 0;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
  text-transform: capitalize;
}
.card-tag.robots { background: rgba(129,140,248,0.15); color: var(--tag-robots); }
.card-tag.scenes { background: rgba(52,211,153,0.15); color: var(--tag-scenes); }
.card-tag.styles { background: rgba(244,114,182,0.15); color: var(--tag-styles); }

/* ── Lightbox ───────────────────────────────── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0,0,0,0.92);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.lightbox.visible { display: flex; opacity: 1; }
.lightbox.opening { display: flex; }

.lightbox-inner {
  max-width: 900px;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.lightbox-img-wrap {
  width: 100%;
  max-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface);
}
.lightbox-img-wrap img {
  max-width: 100%;
  max-height: 70vh;
  object-fit: contain;
}
.lightbox-img-wrap .placeholder {
  padding: 80px 40px;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 14px;
}

.lightbox-meta {
  text-align: center;
  max-width: 600px;
}
.lightbox-name {
  font-family: var(--font-display);
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 4px;
}
.lightbox-category {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--text-muted);
  text-transform: capitalize;
  margin-bottom: 8px;
}
.lightbox-desc {
  font-size: 15px;
  color: var(--text-dim);
  line-height: 1.6;
}

.lightbox-close {
  position: fixed;
  top: 20px;
  right: 24px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 1001;
}
.lightbox-close:hover { background: var(--surface-hover); border-color: var(--text-muted); }

.lightbox-nav {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  z-index: 1001;
}
.lightbox-nav:hover { background: var(--surface-hover); border-color: var(--text-muted); }
.lightbox-nav.prev { left: 16px; }
.lightbox-nav.next { right: 16px; }

/* ── Tab panel ──────────────────────────────── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── No results ─────────────────────────────── */
.no-results {
  text-align: center;
  padding: 64px 24px;
  color: var(--text-muted);
  font-size: 15px;
}
</style>
</head>

<div class="header">

</div>

// ── Image loading tracker ─────────────────────
function checkImage(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(true);
    img.onerror = () => resolve(false);
    img.src = src;
  });
}

async function countLoadedImages(tabKey) {
  const data = TAB_DATA[tabKey];
  let count = 0;
  const checks = data.items.map(item =>
    checkImage(data.dir + item.filename).then(ok => { if (ok) count++; })
  );
  await Promise.all(checks);
  loadedCounts[tabKey] = count;
  updateBadge(tabKey);
}

function updateBadge(tabKey) {
  const badge = document.getElementById("badge-" + tabKey);
  const data = TAB_DATA[tabKey];
  badge.textContent = loadedCounts[tabKey] + "/" + data.expected;
}

function getCategories(tabKey) {
  const seen = [];
  TAB_DATA[tabKey].items.forEach(item => {
    if (!seen.includes(item.category)) seen.push(item.category);
  });
  return seen;
}

function renderFilterBar(tabKey) {
  const bar = document.getElementById("filterBar");
  const cats = getCategories(tabKey);
  const data = TAB_DATA[tabKey];

  let html = '<button class="filter-btn' + (activeFilter === null ? " active" : "") + '" data-filter="all">Show All</button>';
  cats.forEach(cat => {
    const label = CATEGORY_LABELS[cat] || cat;
    const count = data.items.filter(i => i.category === cat).length;
    html += '<button class="filter-btn' + (activeFilter === cat ? " active" : "") + '" data-filter="' + cat + '">' + label + ' (' + count + ')</button>';
  });
  html += '<span class="image-counter" id="imageCounter">' + loadedCounts[tabKey] + ' of ' + data.expected + ' images loaded</span>';
  bar.innerHTML = html;

  bar.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const f = btn.dataset.filter;
      activeFilter = f === "all" ? null : f;
      // Update URL hash
      var hash = tabKey;
      if (activeFilter) hash += "/" + activeFilter;
      history.replaceState(null, "", "#" + hash);
      renderFilterBar(tabKey);
      renderPanel(tabKey);
    });
  });
}

function renderPanel(tabKey) {
  const panel = document.getElementById("panel-" + tabKey);
  const data = TAB_DATA[tabKey];
  const cats = getCategories(tabKey);

  let html = "";
  cats.forEach(cat => {
    if (activeFilter && activeFilter !== cat) return;
    const items = data.items.filter(i => i.category === cat);
    const label = CATEGORY_LABELS[cat] || cat;
    html += '<div class="subcategory-section" data-cat="' + cat + '">';
    html += '<div class="subcategory-header"><span class="subcategory-name">' + label + '</span><span class="subcategory-count">' + items.length + ' concepts</span></div>';
    html += '<div class="card-grid">';
    items.forEach(item => {
      const src = data.dir + item.filename;
      html += '<div class="card" data-id="' + item.id + '" data-tab="' + tabKey + '">';
      html += '<div class="card-thumb">';
      html += '<img src="' + src + '" alt="' + item.name + '" loading="lazy" onerror="this.parentElement.innerHTML=\'<div class=placeholder><div class=placeholder-icon>\u25A2</div>' + item.name + '</div>\'">';
      html += '</div>';
      html += '<div class="card-info"><span class="card-name">' + item.name + '</span><span class="card-tag ' + data.tagClass + '">' + (CATEGORY_LABELS[cat] || cat) + '</span></div>';
      html += '</div>';
    });
    html += '</div></div>';
  });

  if (!html) html = '<div class="no-results">No concepts in this filter.</div>';
  panel.innerHTML = html;

  panel.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openLightbox(card.dataset.tab, card.dataset.id));
  });
}

// ── Tabs ──────────────────────────────────────
function switchTab(tabKey, filter) {
  activeTab = tabKey;
  activeFilter = filter || null;

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.tab === tabKey);
  });
  document.querySelectorAll(".tab-panel").forEach(p => {
    p.classList.toggle("active", p.id === "panel-" + tabKey);
  });

  // Update URL hash for deep linking (gallery.html#styles or #styles/photorealistic)
  var hash = tabKey;
  if (activeFilter) hash += "/" + activeFilter;
  history.replaceState(null, "", "#" + hash);

  renderFilterBar(tabKey);
  renderPanel(tabKey);
}

document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => switchTab(btn.dataset.tab));
});

// Handle browser back/forward
window.addEventListener("hashchange", () => {
  var parts = location.hash.slice(1).split("/");
  if (TAB_DATA[parts[0]]) switchTab(parts[0], parts[1] || null);
});

// ── Lightbox ──────────────────────────────────
function openLightbox(tabKey, itemId) {
  const data = TAB_DATA[tabKey];
  const filtered = activeFilter ? data.items.filter(i => i.category === activeFilter) : data.items;
  currentLightboxItems = filtered.map(i => ({ ...i, dir: data.dir }));
  currentLightboxIndex = currentLightboxItems.findIndex(i => i.id === itemId);
  if (currentLightboxIndex < 0) currentLightboxIndex = 0;
  showLightboxItem();
  const lb = document.getElementById("lightbox");
  lb.classList.add("opening");
  requestAnimationFrame(() => { lb.classList.add("visible"); });
  document.body.style.overflow = "hidden";
}

function showLightboxItem() {
  const item = currentLightboxItems[currentLightboxIndex];
  if (!item) return;
  const src = item.dir + item.filename;
  const wrap = document.getElementById("lbImgWrap");
  wrap.innerHTML = '<img src="' + src + '" alt="' + item.name + '" onerror="this.parentElement.innerHTML=\'<div class=placeholder>Image not yet generated</div>\'">';
  document.getElementById("lbName").textContent = item.name;
  document.getElementById("lbCategory").textContent = (CATEGORY_LABELS[item.category] || item.category) + " \u00B7 " + (currentLightboxIndex + 1) + " of " + currentLightboxItems.length;
  document.getElementById("lbDesc").textContent = item.desc || "";
}

function closeLightbox() {
  const lb = document.getElementById("lightbox");
  lb.classList.remove("visible");
  setTimeout(() => lb.classList.remove("opening"), 250);
  document.body.style.overflow = "";
}

document.getElementById("lbClose").addEventListener("click", closeLightbox);
document.getElementById("lbPrev").addEventListener("click", () => {
  currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxItems.length) % currentLightboxItems.length;
  showLightboxItem();
});
document.getElementById("lbNext").addEventListener("click", () => {
  currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxItems.length;
  showLightboxItem();
});

document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target === e.currentTarget) closeLightbox();
});

document.addEventListener("keydown", e => {
  if (!document.getElementById("lightbox").classList.contains("visible")) return;
  if (e.key === "Escape") closeLightbox();
  if (e.key === "ArrowLeft") { currentLightboxIndex = (currentLightboxIndex - 1 + currentLightboxItems.length) % currentLightboxItems.length; showLightboxItem(); }
  if (e.key === "ArrowRight") { currentLightboxIndex = (currentLightboxIndex + 1) % currentLightboxItems.length; showLightboxItem(); }
});

// ── Init ──────────────────────────────────────
(async function init() {
  // Render immediately with 0 counts
  ["robots","scenes","styles"].forEach(k => updateBadge(k));

  // Deep link: read hash (e.g. #styles, #styles/photorealistic, #robots/adorable)
  var startTab = "robots";
  var startFilter = null;
  if (location.hash) {
    var parts = location.hash.slice(1).split("/");
    if (TAB_DATA[parts[0]]) {
      startTab = parts[0];
      if (parts[1]) startFilter = parts[1];
    }
  }
  switchTab(startTab, startFilter);

  // Then count actual loaded images in background
  await Promise.all(["robots","scenes","styles"].map(k => countLoadedImages(k)));
  // Re-render the counter
  const counter = document.getElementById("imageCounter");
  if (counter) counter.textContent = loadedCounts[activeTab] + " of " + TAB_DATA[activeTab].expected + " images loaded";
})();
</script>
